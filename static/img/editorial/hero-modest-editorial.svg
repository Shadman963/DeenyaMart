  <path d="M355 530L330 960" stroke="#DED5C5" stroke-width="2.5"/>
  <path d="M415 545L410 960" stroke="#DED5C5" stroke-width="2.5"/>
  <path d="M475 535L505 960" stroke="#DED5C5" stroke-width="2.5"/>
  <!-- Secondary Sunset Coral & Berry Layered Shawl Accent (Matching Logo "Mart") -->
  <path d="M450 435C525 435 585 495 605 595L665 960H495L465 570C460 510 445 465 450 435Z" fill="url(#sunsetWave)"/>
  <path d="M525 540L575 960" stroke="#FAF7F2" stroke-opacity="0.28" stroke-width="2"/>
  <!-- Logo-Inspired Flowing Ribbon Curve on Right -->
  <path d="M540 960C555 810 645 730 765 695" stroke="#FED23A" stroke-width="14" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M575 960C590 835 670 765 785 735" stroke="#1CA9B0" stroke-width="10" stroke-linecap="round" stroke-opacity="0.85"/>
