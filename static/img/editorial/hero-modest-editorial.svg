  <path d="M250 960L285 470C292 385 345 330 415 330C485 330 538 385 548 470L590 960H250Z" fill="#FAF7F2"/>
  <path d="M285 470C315 520 375 550 455 540C510 532 540 500 548 470" stroke="#D8CEBE" stroke-width="3" fill="none"/>
  <path d="M335 390C335 345 370 310 415 310C460 310 495 345 495 390C495 455 455 505 415 505C375 505 335 455 335 390Z" fill="#EFE8DA" stroke="#D5CBB8" stroke-width="2"/>
