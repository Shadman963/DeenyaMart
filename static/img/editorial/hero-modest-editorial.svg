<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="1050" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9F3"/>
      <stop offset="50%" stop-color="#F6F2EB"/>
      <stop offset="100%" stop-color="#EBF4F6"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="180" y1="120" x2="720" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D3D54"/>
      <stop offset="55%" stop-color="#0A2E40"/>
      <stop offset="100%" stop-color="#072230"/>
    </linearGradient>
    <linearGradient id="sunsetWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F56B3A"/>
      <stop offset="55%" stop-color="#BA2A67"/>
      <stop offset="100%" stop-color="#9A1F53"/>
    </linearGradient>
    <linearGradient id="tealArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1CA9B0"/>
      <stop offset="100%" stop-color="#0D3D54"/>
    </linearGradient>
    <pattern id="linenWeave" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8H16M8 0V16" stroke="#0D3D54" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="1050" fill="url(#bgGrad)"/>
  <rect width="900" height="1050" fill="url(#linenWeave)"/>
