  <path d="M165 560C295 540 410 420 450 125C300 125 165 252.6 165 410V560Z" fill="url(#tealArc)" fill-opacity="0.45"/>
  <path d="M190 960V415C190 271.4 306.4 155 450 155C593.6 155 710 271.4 710 415V960" stroke="#FED23A" stroke-opacity="0.45" stroke-width="2"/>
