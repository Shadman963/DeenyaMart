  <path d="M479 305C479 252 522 209 575 209C628 209 671 252 671 305H479Z" fill="#F56B3A" fill-opacity="0.88"/>
  <circle cx="575" cy="305" r="118" stroke="#FED23A" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 6"/>
