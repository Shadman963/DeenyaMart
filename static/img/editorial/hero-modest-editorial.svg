  <circle cx="88" cy="86" r="5" fill="#F56B3A"/>
  <circle cx="102" cy="86" r="5" fill="#BA2A67"/>
  <text x="118" y="91" fill="#0D3D54" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">DEENYAMART ATELIER</text>
</svg>