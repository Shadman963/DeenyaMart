<dialog id="dm-cart-drawer" class="dm-drawer dm-drawer--right" aria-labelledby="dm-cart-drawer-title">
  <div class="dm-drawer__layout">
    <div class="dm-drawer__header">
      <div class="dm-cart-drawer__heading">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <h2 id="dm-cart-drawer-title" class="dm-drawer__title">
          Your Shopping Bag (<span data-cart-count class="dm-tabular">{{ cart_count|default:0 }}</span>)
        </h2>
      </div>
      <button type="button" class="dm-drawer__close" data-close-dialog aria-label="Close shopping bag">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="dm-cart-drawer-body" class="dm-drawer__body dm-cart-drawer__body">
      {% include "cart/partials/cart_drawer_body.html" %}
    </div>
  </div>
</dialog>
