<dialog id="dm-cart-drawer" class="dm-drawer dm-drawer--right" aria-labelledby="dm-cart-drawer-title">
  <div class="dm-drawer__layout">
    <div class="dm-drawer__header">
      <h2 id="dm-cart-drawer-title" class="dm-drawer__title">
        Your Shopping Bag (<span data-cart-count class="dm-tabular">{{ cart_count|default:0 }}</span>)
      </h2>
      <button type="button" class="dm-drawer__close" data-close-dialog aria-label="Close shopping bag">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="dm-cart-drawer-body" class="dm-drawer__body" style="display: flex; flex-direction: column;">
      {% include "cart/partials/cart_drawer_body.html" %}
    </div>
  </div>
</dialog>
